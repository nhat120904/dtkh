[server]
# Phục vụ font chữ trong thư mục static/ để chạy offline hoàn toàn
enableStaticServing = true
maxUploadSize = 200
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2F5BEA"
backgroundColor = "#FFF8E7"
secondaryBackgroundColor = "#FFF0C9"
textColor = "#1B1F2A"
linkColor = "#2F5BEA"
borderColor = "#1B1F2A"
showWidgetBorder = true
baseRadius = "14px"
buttonRadius = "14px"
font = "'Be Vietnam Pro', sans-serif"
headingFont = "'Baloo 2', 'Be Vietnam Pro', sans-serif"
headingFontWeights = [800, 800, 700, 700, 700, 700]
chartCategoricalColors = ["#2F5BEA", "#FF7A30", "#0E9F8A", "#FFC93C", "#E5484D", "#7C5CFF"]

[theme.sidebar]
backgroundColor = "#FFF0C9"
secondaryBackgroundColor = "#FFF8E7"

[[theme.fontFaces]]
family = "Be Vietnam Pro"
url = "app/static/fonts/BeVietnamPro-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Be Vietnam Pro"
url = "app/static/fonts/BeVietnamPro-Medium.ttf"
weight = 500

[[theme.fontFaces]]
family = "Be Vietnam Pro"
url = "app/static/fonts/BeVietnamPro-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "Be Vietnam Pro"
url = "app/static/fonts/BeVietnamPro-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "Baloo 2"
url = "app/static/fonts/Baloo2-Variable.ttf"
weight = "400 800"

[[theme.fontFaces]]
family = "Chakra Petch"
url = "app/static/fonts/ChakraPetch-Medium.ttf"
weight = 500

[[theme.fontFaces]]
family = "Chakra Petch"
url = "app/static/fonts/ChakraPetch-SemiBold.ttf"
weight = 600

[[theme.fontFaces]]
family = "Chakra Petch"
url = "app/static/fonts/ChakraPetch-Bold.ttf"
weight = 700
